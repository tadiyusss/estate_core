<div x-data="chat_support()" x-cloak>
	<button @click="open()" x-show="!open_chat_bubble" class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-emerald-800 text-white shadow-lg hover:bg-emerald-700 transition flex items-center justify-center z-40">
		<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
		</svg>
	</button>
	<div x-show="open_chat_bubble" @click="close()" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 md:hidden"></div>
	<!-- chat window -->
	<div x-show="open_chat_bubble" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95 translate-y-4" x-transition:enter-end="opacity-100 scale-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95" class="fixed bottom-6 right-6 w-full max-w-sm h-[600px] bg-white rounded-2xl shadow-2xl ring-1 ring-zinc-200 overflow-hidden flex flex-col z-50">
		<!-- header -->
		<div class="bg-emerald-800 text-white px-5 py-4 flex items-center justify-between">
			<div>
				<h3 class="font-display font-semibold">Live Chat Support</h3>
				<p class="text-xs text-emerald-100">We typically reply in 2-5 min</p>
			</div>
			<button @click="close()" class="w-8 h-8 rounded-full hover:bg-emerald-700 flex items-center justify-center transition">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<line x1="18" y1="6" x2="6" y2="18" />
					<line x1="6" y1="6" x2="18" y2="18" />
				</svg>
			</button>
		</div>
		<!-- form (initial screen) -->
		<template x-if="client_uuid === null">
			<div class="flex-1 flex flex-col p-5 justify-between">
				<div class="space-y-4">
					<p class="text-sm text-zinc-600">Before we chat, please tell us a bit about yourself</p>
					<div>
						{{ live_messages_form.fullname.label(class="block text-xs font-medium text-emerald-700 mb-1.5") }}
						{{ live_messages_form.fullname }}
						<template x-for="(error, key) in start_chat_form_errors.fullname" :key="key">
							<p class="text-xs text-red-500 mt-1" x-text="error"></p>
						</template>
					</div>
					<div>
						{{ live_messages_form.email.label(class="block text-xs font-medium text-emerald-700 mb-1.5") }}
						{{ live_messages_form.email }}
						<template x-for="(error, key) in start_chat_form_errors.email" :key="key">
							<p class="text-xs text-red-500 mt-1" x-text="error"></p>
						</template>
					</div>
					<div>
						{{ live_messages_form.phone_number.label(class="block text-xs font-medium text-emerald-700 mb-1.5") }}
						{{ live_messages_form.phone_number }}
						<template x-for="(error, key) in start_chat_form_errors.phone_number" :key="key">
							<p class="text-xs text-red-500 mt-1" x-text="error"></p>
						</template>	
					</div>
				</div>
				<button @click="start_chat()" :disabled="!start_chat_form_data.fullname || !start_chat_form_data.email || !start_chat_form_data.phone_number" class="w-full bg-emerald-800 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition"> Start Chat </button>
			</div>
		</template>
		<template x-if="client_uuid !== null">
			<div class="flex flex-col h-full min-h-0">
				<!-- messages -->
				<div class="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-3" x-ref="messagesContainer">
					<template x-for="msg in messages" :key="msg.uuid">
						<div class="flex" :class="msg.sender === 'client' ? 'justify-end' : 'justify-start'">
							<div class="max-w-xs flex flex-col" :class="msg.sender === 'client' ? 'items-end' : 'items-start'">
								<p class="text-xs text-zinc-400" x-text="msg.name"></p>
								<template x-if="msg.content_type === 'image'">
									<a :href="'/media/' + msg.content" target="_blank" class="block">
										<img :src="'/media/' + msg.content" alt="Shared image" class="max-h-48 w-auto max-w-full rounded-lg" :class="msg.sender === 'client' ? 'rounded-br-none' : 'rounded-bl-none'" />
									</a>
								</template>
								<template x-if="msg.content_type === 'file'">
									<a :href="'/media/' + msg.content" target="_blank" class="px-3.5 py-2.5 rounded-lg text-sm underline break-all" :class="msg.sender === 'client'
                    ? 'bg-emerald-800 text-white rounded-br-none'
                    : 'bg-zinc-100 text-zinc-800 rounded-bl-none'" x-text="msg.content_name"></a>
								</template>
								<template x-if="msg.content_type === 'text' || !msg.content_type">
									<div class="px-3.5 py-2.5 rounded-lg text-sm" :class="msg.sender === 'client'
                    ? 'bg-emerald-800 text-white rounded-br-none'
                    : 'bg-zinc-100 text-zinc-800 rounded-bl-none'" x-text="msg.text"></div>
								</template>
								<p class="text-xs text-zinc-400 mt-1" x-text="msg.time"></p>
							</div>
						</div>
					</template>
					<div class="flex justify-center" x-show="connected == false">
						<span class="text-[11px] text-red-800 bg-red-100 px-3 py-1 rounded-full">You are disconnected from the server.</span>
					</div>
				</div>
				<!-- input -->	
				<div class="shrink-0 border-t border-zinc-200 p-3.5 bg-zinc-50">
					<form @submit.prevent="send_message()" class="flex items-center gap-2">
						<input x-model="new_message" type="text" :disabled="!connected" placeholder="Type your message..." class="flex-1 bg-white rounded-lg px-3.5 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:ring-2 focus:ring-emerald-700/30 transition border border-zinc-200 disabled:opacity-50 disabled:cursor-not-allowed" />
						<button type="submit" :disabled="!new_message.trim()" class="w-10 h-10 rounded-lg bg-emerald-800 text-white flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-700 transition shrink-0">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
								<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
							</svg>
						</button>
					</form>
				</div>
			</div>
		</template>
	</div>
</div>
